[build]
  # Build order: SPA first (creates dist/), then Astro, then merge Astro output
  # into the SPA dist/ so grammar files aren't wiped by the Vite build.
  # _astro/ contains Astro's JS/CSS chunks; grammar/ contains the HTML pages.
  command = "npm run build && cd astro-site && npm install && npm run build && cd .. && cp -r astro-site/dist/grammar dist/grammar && cp -r astro-site/dist/vergleich dist/vergleich && cp -r astro-site/dist/leitfaden dist/leitfaden && cp -r astro-site/dist/pruefung dist/pruefung &&cp -r astro-site/dist/telc-b1-komplettvorbereitung dist/telc-b1-komplettvorbereitung && cp -r astro-site/dist/pricing dist/pricing && cp -r astro-site/dist/privacy dist/privacy && cp -r astro-site/dist/impressum dist/impressum && mkdir -p dist/_astro && cp -r astro-site/dist/_astro/. dist/_astro/ && cp astro-site/dist/404.html dist/404.html && mv dist/index.html dist/app.html && cp astro-site/dist/index.html dist/index.html && cp astro-site/dist/sitemap-0.xml dist/ && node scripts/prerender-spa-routes.mjs && (node scripts/ping-indexnow.mjs || true)"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# 07:00 UTC daily (09:00 CET / 08:00 GMT)
[functions."daily-sentence"]
  schedule = "0 7 * * *"

# Trial lifecycle (day 3 / day 6 / day-after). An hour after the daily sentence
# so the two jobs never overlap. The schedule() wrapper in the function is the
# authoritative declaration; this mirrors it.
[functions."trial-lifecycle"]
  schedule = "0 8 * * *"

# Activation lifecycle (behavioural: signed up, zero lessons). 90 minutes after
# trial-lifecycle so the jobs never overlap. SHIPS OFF — the function no-ops
# unless LIFECYCLE_ACTIVATION_ENABLED=true is set in the Netlify env, and even
# then cannot send until migrations/2026-08-22-activation-lifecycle.sql is
# applied. The schedule() wrapper in the function is authoritative; this
# mirrors it.
[functions."activation-lifecycle"]
  schedule = "30 9 * * *"

# Weekly truth run (Monday 06:00 UTC): measures revenue/users/learning into
# weekly_metrics and emails the owner the deltas. The schedule() wrapper in
# the function is authoritative; this mirrors it.
[functions."weekly-truth"]
  schedule = "0 6 * * 1"

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-XSS-Protection = "1; mode=block"
    # Report-Only first: watch the browser console / reporting endpoint for
    # violations in production, then promote to Content-Security-Policy once
    # the origin list is confirmed complete (see EVALUATION.md).
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://us-assets.i.posthog.com https://app.lemonsqueezy.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' blob: data: https://omqyueddktqeyrrqvnyq.supabase.co; connect-src 'self' https://omqyueddktqeyrrqvnyq.supabase.co wss://omqyueddktqeyrrqvnyq.supabase.co https://www.google-analytics.com https://us.i.posthog.com https://us-assets.i.posthog.com https://api.lemonsqueezy.com; frame-src https://app.lemonsqueezy.com https://deutsch-meister.lemonsqueezy.com https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Hashed bundles — filenames change on every build, safe to cache forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Unhashed root assets. These have stable filenames, so they cannot be
# "immutable", but they were falling through to Netlify's default of
# max-age=0 — meaning a revalidation round trip for consent.js on every one of
# the ~90 pages that defer-load it in the head.
[[headers]]
  for = "/consent.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/logo.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og-image.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The raw SPA shell is a duplicate of every prerendered route — never index it
[[headers]]
  for = "/app.html"
  [headers.values]
    X-Robots-Tag = "noindex"

# Canonical host is the apex domain — collapse www to avoid split signals
[[redirects]]
  from = "https://www.deutsch-meister.de/*"
  to = "https://deutsch-meister.de/:splat"
  status = 301
  force = true

# Force lowercase grammar level URLs
[[redirects]]
  from = "/grammar/A1.1"
  to = "/grammar/a1.1/"
  status = 301

[[redirects]]
  from = "/grammar/A1.2"
  to = "/grammar/a1.2/"
  status = 301

[[redirects]]
  from = "/grammar/A2.1"
  to = "/grammar/a2.1/"
  status = 301

[[redirects]]
  from = "/grammar/A2.2"
  to = "/grammar/a2.2/"
  status = 301

[[redirects]]
  from = "/grammar/B1.1"
  to = "/grammar/b1.1/"
  status = 301

[[redirects]]
  from = "/grammar/B1.2"
  to = "/grammar/b1.2/"
  status = 301

[[redirects]]
  from = "/grammar/B2.1"
  to = "/grammar/b2.1/"
  status = 301

[[redirects]]
  from = "/grammar/B2.2"
  to = "/grammar/b2.2/"
  status = 301

# Podcast RSS Feed
[[redirects]]
  from = "/podcast-feed.xml"
  to = "/.netlify/functions/podcast-feed"
  status = 200

# Speaking API proxy — enumerated, not a wildcard.
# `/api/speaking/*` -> `/.netlify/functions/:splat` proxied EVERY function under a
# path whose name implies a narrow scope: /api/speaking/lemonsqueezy-webhook,
# /api/speaking/send-campaign and /api/speaking/unsubscribe all resolved. Each
# target has its own auth so nothing was directly exploitable, but it silently
# re-exposed every current and future function. Only the four the SPA calls are
# routed here.
[[redirects]]
  from = "/api/speaking/speaking-session"
  to = "/.netlify/functions/speaking-session"
  status = 200

[[redirects]]
  from = "/api/speaking/speaking-turn"
  to = "/.netlify/functions/speaking-turn"
  status = 200

[[redirects]]
  from = "/api/speaking/evaluate-speaking"
  to = "/.netlify/functions/evaluate-speaking"
  status = 200

[[redirects]]
  from = "/api/speaking/check-speaking-usage"
  to = "/.netlify/functions/check-speaking-usage"
  status = 200

# Unsubscribe handler
[[redirects]]
  from = "/unsubscribe"
  to = "/.netlify/functions/unsubscribe"
  status = 200

# Return 404 for missing hashed assets (prevents serving index.html as JS/CSS)
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# Daily sentence trigger (test via /api/daily-sentence?test=true)
[[redirects]]
  from = "/api/daily-sentence"
  to = "/.netlify/functions/daily-sentence"
  status = 200

# Test endpoint — always sends only to zaid@deutsch-meister.de
[[redirects]]
  from = "/api/send-daily-test"
  to = "/.netlify/functions/send-daily-test"
  status = 200

# ---------------------------------------------------------------------------
# SPA route allow-list — serve the app shell (200) for every REAL client-side
# route in the React router (src/App.jsx).
#
# The app shell is dist/app.html, NOT dist/index.html. The build renames the
# Vite-built SPA shell (dist/index.html) to dist/app.html and drops the static
# Astro homepage in at dist/index.html, so "/" serves the static marketing page
# while every SPA route below rewrites to /app.html (the unchanged React shell).
#
# Netlify serves existing static files (root index.html, /pricing/, grammar/,
# vergleich/, leitfaden/, _astro/, /404.html, public assets) directly and skips
# these non-forced rewrites, so only param/hash SPA routes reach here. Anything
# NOT matched here falls through to the 404 rule below — that is what turns
# unknown URLs into real HTTP 404s instead of a 200 + SPA shell.
#
# Keep this list in sync with the <Route> paths in src/App.jsx.
# ---------------------------------------------------------------------------

# --- Exact SPA routes ---
[[redirects]]
  from = "/intro"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/login"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/signup"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/reset-password"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/update-password"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/verify-email"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/onboarding"
  to = "/app.html"
  status = 200
# Course area (one-time product entitlement, PurchaseGuard-gated in the SPA).
# Deliberately NOT prerendered and NOT in the sitemap: it is paid content
# behind a login, so the crawlable three-place treatment does not apply.
[[redirects]]
  from = "/telc-b1-kurs"
  to = "/app.html"
  status = 200
# Same posture: the A1 band's 30-day plan, gated on LevelSubscriptionGuard
# (Pro/trial or the A1 course) rather than PurchaseGuard, but still paid
# content behind a login — not prerendered, not in the sitemap.
[[redirects]]
  from = "/start-deutsch-1-kurs"
  to = "/app.html"
  status = 200
# The A1.1-Phase 28-day plan (Course Factory Wave 2 PR D) — gated on
# LevelSubscriptionGuard(level="a1.1"), a free level, so open to every
# logged-in user. Still not prerendered and not in the sitemap: it is a
# behind-login course area like the two above, not a crawlable landing page.
[[redirects]]
  from = "/a1-1-phase"
  to = "/app.html"
  status = 200
# Mock exams (subscription-gated practice tests). Same posture as the course
# area: not prerendered, not in the sitemap; the wildcard is safe here because
# there is no static /modelltest directory for it to shadow, and unknown slugs
# render the SPA's own guarded not-found state.
[[redirects]]
  from = "/modelltest"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/modelltest/*"
  to = "/app.html"
  status = 200
# Writing practice (AI-graded, server-gated in evaluate-writing.mjs).
[[redirects]]
  from = "/schreiben"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/schreiben/*"
  to = "/app.html"
  status = 200
# /pricing is now a static Astro file in dist/pricing/ — Netlify serves that
# real file before any non-forced rewrite, so no SPA rule is needed for it.
# /faq and /ueber-uns are prerendered static files now (dist/faq/index.html,
# dist/ueber-uns/index.html) — Netlify serves the real file before any unforced
# rewrite and 301s the slash-less form, same as /pricing. No SPA rule needed.
[[redirects]]
  from = "/podcasts"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/level-test"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/dashboard"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/profile"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/vocabulary"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/speaking"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/analyze"
  to = "/app.html"
  status = 200

# --- Route families (bare route + params/sub-paths) ---
[[redirects]]
  from = "/subscription"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/subscription/*"
  to = "/app.html"
  status = 200
# /vergleich (hub), /vergleich/babbel|duolingo|lingoda and /leitfaden/telc-b1 are
# now static Astro files in dist/ — Netlify serves those real files before these
# non-forced rewrites. These remain only as the SPA fallback for any OTHER
# /vergleich/* or /leitfaden/* path that has no static file (e.g. an unknown
# comparison slug, which the SPA redirects to the hub). The bare "/vergleich"
# exact rule was removed so it can't shadow the static hub index.
# /vergleich/* and /leitfaden/* had wildcard rewrites here. They were the same
# soft-404 the blanket /grammar/* rule caused — any invented slug answered 200 with
# the app shell, which GSC reports as a soft 404. Every real URL under both prefixes
# is a static Astro file that wins before any unforced rewrite, and src/App.jsx has
# no /leitfaden routes at all, so nothing is lost. Unknown slugs now fall through to
# the /* -> /404.html catch-all and return a true 404.
[[redirects]]
  from = "/video-library"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/video-library/*"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/level/*"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/reading"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/reading/*"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/listening"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/listening/*"
  to = "/app.html"
  status = 200
[[redirects]]
  from = "/admin/*"
  to = "/app.html"
  status = 200

# Grammar is served as static Astro files in dist/grammar/ — the hub, all 8
# level pages and all 64 topic pages are real files that win before any rule
# here. A blanket /grammar/* -> app.html (200) therefore caught ONLY paths that
# do not exist, and answered them with 200 + the app shell: a textbook soft 404,
# which is exactly what Google Search Console reported. Verified in production:
# /grammar/a1.1/nicht-existierendes-thema returned 200 with 14 KB of shell.
#
# /grammar/overview was the one SPA route under this prefix — an orphan with
# zero inbound links, deleted in the renovation. 301 to the hub so any old
# bookmark or index entry lands somewhere real.
[[redirects]]
  from = "/grammar/overview"
  to = "/grammar/"
  status = 301

# ---------------------------------------------------------------------------
# Real 404 — final catch-all. Any request that is neither a static file nor a
# known SPA route above returns the static 404 page WITH a 404 status (not the
# old 200 + SPA shell). Must stay LAST so the allow-list wins first.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
