<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1600, height=560" />
    <title>Hero Line</title>
    <!-- GSAP 3.14.2, vendored: the agent proxy blocks the CDN, and a local file keeps the render offline. -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --bg: #ffffff; /* the scene's own palette lives on its root in compositions/index.html */
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1600px;
        height: 560px;
        overflow: hidden;
        background: var(--bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
      }
      #root > #el-line {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="hero-line"
      data-start="0"
      data-duration="14"
      data-fps="30"
      data-width="1600"
      data-height="560"
    >
      <!-- Die Linie hero: one 14 s loop (poster at 12.6 s). All motion lives in the sub-composition. -->
      <div
        id="el-line"
        data-composition-id="line-scene"
        data-composition-src="compositions/index.html"
        data-start="0"
        data-duration="14"
        data-track-index="0"
        data-width="1600"
        data-height="560"
      ></div>
    </div>
    <script>
      window.__timelines["hero-line"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
