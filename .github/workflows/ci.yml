name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check duplicated data files stay in sync
        run: node scripts/check-duplicates.mjs

      # Guards what the buyer is told: derived pricing figures, no retyped price
      # literals, no "unlimited" claim on a metered plan, and — the one that
      # earns its keep — the limits in src/data/marketing.js parsed out of the
      # Netlify functions that enforce them and compared. See tests/claims.test.mjs.
      # NOTE: package.json's test script leaves the glob UNQUOTED on purpose, so
      # the shell expands it to real paths. This job pins Node 20, whose --test
      # takes file paths rather than glob patterns (glob support landed in Node
      # 22), and a quoted glob reaches node verbatim and fails to match.
      - name: Claim + pricing guards
        run: npm test

      - name: Syntax-check Netlify functions
        run: |
          for f in netlify/functions/*.mjs netlify/functions/*.js netlify/functions/_shared/*.mjs; do
            node --check "$f"
          done

      - name: Build SPA
        run: npm run build

      # Verify the BUILT HTML, not the source that produced it. The prerendered
      # SPA routes get their title/canonical/visible copy injected at build time
      # (scripts/prerender-spa-routes.mjs), so reviewing the source tells you
      # what the injector intends, never what a crawler receives. Reproduces the
      # two Netlify build steps the check needs, then reads dist/.
      - name: Carve the SPA shell out of dist
        run: mv dist/index.html dist/app.html

      # The Astro half builds OFFLINE from the committed grammar cache — the
      # egress-free path the comment below always described. Order matters: the
      # SPA build made dist/, app.html was carved out above, and the copy steps
      # mirror netlify.toml's build command so the verify step sees the same
      # dist/ a deploy produces.
      - name: Guard the grammar cache freshness
        run: |
          node -e "
            const c = require('./grammar-content-cache.json');
            const days = Math.floor((Date.now() - new Date(c.dumpedAt)) / 86400000);
            console.log('grammar-content-cache.json dumped ' + c.dumpedAt + ' (' + days + ' days ago): ' +
              c.topics.length + ' topics, ' + c.rules.length + ' rules, ' + c.examples.length + ' examples, ' + c.exercises.length + ' exercises');
            if (days > 30) console.log('::warning title=Stale grammar cache::grammar-content-cache.json is ' + days +
              ' days old. CI is verifying against a snapshot, not the database — refresh with: node scripts/dump-grammar-cache.mjs grammar-content-cache.json');
          "

      - name: Build Astro site (offline, from the committed cache)
        run: |
          npm --prefix astro-site ci
          GRAMMAR_CONTENT_CACHE="$PWD/grammar-content-cache.json" npm --prefix astro-site run build | tee /tmp/astro-build.log
          # The cache loader fails OPEN: a corrupt cache silently falls back to a
          # live Supabase fetch, which dies much later with a misleading error.
          grep -q 'Using content cache' /tmp/astro-build.log

      - name: Merge Astro output into dist (mirrors netlify.toml)
        run: |
          cp -r astro-site/dist/grammar dist/grammar
          cp -r astro-site/dist/vergleich dist/vergleich
          cp -r astro-site/dist/leitfaden dist/leitfaden
          cp -r astro-site/dist/pricing dist/pricing
          cp -r astro-site/dist/privacy dist/privacy
          cp -r astro-site/dist/impressum dist/impressum
          mkdir -p dist/_astro && cp -r astro-site/dist/_astro/. dist/_astro/
          cp astro-site/dist/404.html dist/404.html
          cp astro-site/dist/index.html dist/index.html
          cp astro-site/dist/sitemap-0.xml dist/

      - name: Prerender SPA routes
        run: node scripts/prerender-spa-routes.mjs

      # No --spa-only: with the Astro half built above, all ~95 pages are
      # checked — previously only the Netlify deploy build ever saw them.
      - name: Verify built HTML
        run: node scripts/check-built-html.mjs dist

